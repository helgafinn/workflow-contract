name: Deploy application

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: string
      retries:
        description: Retry count
        type: number
        default: 2
    secrets:
      azure_credentials:
        description: Azure credentials
        required: true
    outputs:
      deployment_url:
        description: Deployed application URL
        value: '${{ jobs.deploy.outputs.url }}'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      url: '${{ steps.result.outputs.url }}'
    steps:
      - id: result
        run: echo "url=https://example.invalid" >> "$GITHUB_OUTPUT"
